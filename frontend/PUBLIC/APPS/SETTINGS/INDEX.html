<SCRIPT TYPE="TEXT/JAVASCRIPT" ID="CONSTRUCTOR">
var __${PID}__2FA_STATUS;

async function
	__${PID}__MAIN()
{
	__${PID}__2FA_STATUS =
		await AJAX_SEND("/ajax/usermanagement/get_2fa/", {});

	if (__${PID}__2FA_STATUS.STATUS === 0)
		__${PID}__2FA_STATUS = __${PID}__2FA_STATUS.THIS.FA;
	else
	{
		BSOD("Failed to get __${PID}__2FA_STATUS");
		return ;
	}

	if (__${PID}__2FA_STATUS)
		document.getElementById("__${PID}__2FA_CHECKBOX").checked = true;
    else
	document.getElementById("__${PID}__2FA_CHECKBOX").checked = false;

	for (
		const DATA_ENTITY of
		[
			"RIGHT_PLAYER_COLOR",
			"LEFT_PLAYER_COLOR",
			"BALL_COLOR",
			"TABLE_COLOR"
		]
	)
	{
		for (const CHAR of "0123456789ABCDEF")
		{
			const ELEMENT =
				document.getElementById(
					"__${PID}__RADIO_" + DATA_ENTITY + "_" + CHAR + "_"
				);

			if (GAME_STYLE[DATA_ENTITY] === CHAR)
				ELEMENT.checked = true;
		}
	}
}

__${PID}__MAIN();
</SCRIPT>
<SCRIPT TYPE="TEXT/JAVASCRIPT" ID="DESTRUCTOR">

</SCRIPT>
<SCRIPT TYPE="TEXT/JAVASCRIPT" ID="EVENTS">
async function
	__${PID}__SET_2FA()
{
	if (__${PID}__2FA_STATUS)
	{
		document.getElementById("__${PID}__2FA_CHECKBOX").checked = true;
		__${PID}__2FA_STATUS = false;
	}
	else
	{
		document.getElementById("__${PID}__2FA_CHECKBOX").checked = false;
		__${PID}__2FA_STATUS = true;
	}

	const RESPONSE =
		await AJAX_SEND("/ajax/usermanagement/two_factor_permit/",
			{
				STATE: __${PID}__2FA_STATUS
			}
		);

	if (RESPONSE.STATUS !== 0)
	{
		BSOD("Failed to get __${PID}__2FA_STATUS");
		return ;
	}
}

function
	__${PID}__RADIO(THIS)
{
	const DATA_ENTITY = THIS.getAttribute('DATA-ENTITY');
	const DATA_COLOR = THIS.getAttribute('DATA-COLOR');

	GAME_STYLE[DATA_ENTITY] = DATA_COLOR;

	for (const CHAR of "0123456789ABCDEF")
	{
		const ELEMENT =
			document.getElementById(
				"__${PID}__RADIO_" + DATA_ENTITY + "_" + CHAR + "_"
			);

		ELEMENT.checked = false;
	}

	THIS.checked = true;
}
</SCRIPT>
