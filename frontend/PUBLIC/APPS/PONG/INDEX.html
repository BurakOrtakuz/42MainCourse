async function
	__${PID}__VS_BOT(EVENT)
{
	if (
		EVENT &&
		(EVENT.key !== ' ' && EVENT.key !== 'Enter' && EVENT.type !== "click")
	)
		return ;

	__${PID}__MAIN_MENU_CONTAINER_HTML = __${PID}__.innerHTML;
	__${PID}__.innerHTML = "";

	const RESPONSE = await AJAX_SEND("/ajax/pong/one_player/", {});

	if (RESPONSE.STATUS !== 0 || !RESPONSE.THIS)
	{
		LOG(
			__LANG__[LANG].PONG.ERROR.CONNECTION.MESSAGE +
				RESPONSE.STATUS + ")",
			"ERROR",
			{
				TITLE: __LANG__[LANG].PONG.ERROR.CONNECTION.TITLE,
			},
			"${PID}"
		);
		__${PID}__.innerHTML = __${PID}__MAIN_MENU_CONTAINER_HTML;
		return ;
	}

	switch (RESPONSE.THIS.error_level)
	{
		case (0):
		{
			__${PID}__LEFT_WON_MESSAGE = __LANG__[LANG].PONG.BOT_WON;
			__${PID}__RIGHT_WON_MESSAGE = __LANG__[LANG].PONG.YOU_WON;
			function
				animate()
			{
				if (!__${PID}__ON_GAME)
					return ;

				requestAnimationFrame(animate);

				if (
					__${PID}__GAME.keyState['arrowup'] ||
					__${PID}__GAME.keyState['w']
				)
				{
					SEND_WEB_SOCKET(
						__${PID}__GAME_SOCKET,
						{
							'rightPaddleMovement': false
						}
					);
				}

				if (
					__${PID}__GAME.keyState['arrowdown'] ||
					__${PID}__GAME.keyState['s']
				)
				{
					SEND_WEB_SOCKET(
						__${PID}__GAME_SOCKET,
						{
							'rightPaddleMovement': true
						}
					);
				}

				__${PID}__GAME.renderer.render(
					__${PID}__GAME.scene,
					__${PID}__GAME.camera
				);
			}

			const ROOM_NAME = RESPONSE.THIS.room_name;

			SET_TITLE(__LANG__[LANG].PONG.PLAYING_WITH + "BOT", "${PID}");
			__${PID}__GAME_SOCKET =
				new WebSocket('wss://' + window.location.host +
					'/ws/pong/one_player/' + ROOM_NAME + "/");
			__${PID}__.innerHTML =
				"<CANVAS ID='__${PID}__GAME_SCREEN'></CANVAS>";
			__${PID}__GAME_SOCKET.onclose = __${PID}__HANDLE_WEBSOCKET_CLOSED;
			window.onbeforeunload = __${PID}__HANDLE_WEBSOCKET_CLOSED;
			__${PID}__GAME_SOCKET.onmessage = __${PID}__HANDLE_WEBSOCKET_EVENT;
			__${PID}__ON_GAME = true;
			__${PID}__GAME.renderer =
				new THREE.WebGLRenderer(
					{
						canvas:
							document.getElementById("__${PID}__GAME_SCREEN")
					}
				);
			__${PID}__GAME.renderer.setSize(
				__${PID}__GAME_SIZE.WIDTH,
				__${PID}__GAME_SIZE.HEIGHT
			);
			animate();
		}
		break ;
		case (1):
		{
			LOG(
				__LANG__[LANG].PONG.ERROR.ROOM_CREATE.MESSAGE +
					RESPONSE.THIS.error_level + ")",
				"ERROR",
				{
					TITLE: __LANG__[LANG].PONG.ERROR.ROOM_CREATE.TITLE,
				},
				"${PID}"
			);
			__${PID}__.innerHTML = __${PID}__MAIN_MENU_CONTAINER_HTML;
		}
		break ;
		case (5):
		{
			LOG(
				__LANG__[LANG].PONG.ERROR._5.MESSAGE +
					RESPONSE.THIS.error_level + ")",
				"ERROR",
				{
					TITLE: __LANG__[LANG].PONG.ERROR._5.TITLE,
				},
				"${PID}"
			);
			__${PID}__.innerHTML = __${PID}__MAIN_MENU_CONTAINER_HTML;
		}
		break ;
		default:
		{
			LOG(
				__LANG__[LANG].PONG.ERROR.CONNECTION.MESSAGE +
					RESPONSE.THIS.error_level + ")",
				"ERROR",
				{
					TITLE: __LANG__[LANG].PONG.ERROR.CONNECTION.TITLE,
				},
				"${PID}"
			);
			__${PID}__.innerHTML = __${PID}__MAIN_MENU_CONTAINER_HTML;
		}
	}
}

async function
	__${PID}__HANDLE_WEBSOCKET_EVENT(__EVENT__)
{
	const DATA = JSON.parse(__EVENT__.data);

	SRV_STATUS("GET");
	if (
		DATA.scoreLeft !== undefined &&
		DATA.scoreRight !== undefined
	)
	{
		if (__${PID}__TOURNAMENT)
		{
			SET_TITLE(
				__${PID}__LEFT_PLAYER + "[" + DATA.scoreLeft +
				"] - [" + DATA.scoreRight + "]" +
				__${PID}__RIGHT_PLAYER,
				"${PID}"
			);
		}
		else
		{
			SET_TITLE(
				"[" + DATA.scoreLeft + "] - [" + DATA.scoreRight + "]",
				"${PID}"
			);
		}
	}

	if (
		(DATA.isFinished !== undefined && DATA.isFinished === true) ||
		(DATA.whoWin !== undefined && DATA.whoWin !== 0)
	)
	{
		if (
			DATA.isFinished &&
			typeof(DATA.whoWin) === "string" &&
			DATA.whoWin === " "
		)
			LOG(__LANG__[LANG].PONG.PLAYER_EXIT);

		if (DATA.whoWin === -1 && __${PID}__TOURNAMENT)
			__${PID}__WINNER_TOURNAMENT = __${PID}__LEFT_PLAYER;
		else if (DATA.whoWin === 1 && __${PID}__TOURNAMENT)
			__${PID}__WINNER_TOURNAMENT = __${PID}__RIGHT_PLAYER;
		else if (DATA.whoWin === -1)
			LOG(__${PID}__LEFT_WON_MESSAGE);
		else if (DATA.whoWin === 1)
			LOG(__${PID}__RIGHT_WON_MESSAGE);
		else if (typeof(DATA.whoWin) === "string")
		{
			/*
			if (__${PID}__IN_TORUNAMENT)
			{
				const TOURNAMENT_RESPONSE =
					await AJAX_SEND("/ajax/pong/check_tournament/",
						{
							ROOM_NAME: __${PID}__ROOM_NAME,
							WINNER: __${PID}__WINNER_TOURNAMENT,
						}
					);

				__${PID}__WINNER_TOURNAMENT = undefined;

				if (DATA.whoWin !== TOURNAMENT_RESPONSE.THIS.who_am_i)
				{
					__${PID}__ROOM_NAME = undefined;
					__${PID}__IN_TORUNAMENT = false;
				}

				if (!TOURNAMENT_RESPONSE.THIS.check_available)
					__${PID}__ROOM_NAME = undefined;
			}
			*/

			__${PID}__WINNER_TOURNAMENT = DATA.whoWin;

			LOG(
				DATA.whoWin + __LANG__[LANG].PONG.MULTIPLAYER_WHO_WON
			);
		}

		__${PID}__SOCKET_CLOSED_NORMALLY = true;
		__${PID}__ON_GAME = false;
		__${PID}__GAME_SOCKET.close();
	}

	if (DATA.rightPaddleZ !== undefined)
	{
		__${PID}__GAME.rightPaddle.position.z = DATA.rightPaddleZ;
	}

	if (DATA.leftPaddleZ !== undefined)
	{
		__${PID}__GAME.leftPaddle.position.z = DATA.leftPaddleZ;
	}

	if (DATA.ballX !== undefined)
	{
		__${PID}__GAME.ball.position.x = DATA.ballX;
	}

	if (DATA.ballZ !== undefined)
	{
		__${PID}__GAME.ball.position.z = DATA.ballZ;
	}
};
